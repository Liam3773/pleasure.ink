<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>♡</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  overflow:hidden;
  background:black;
  width:100%;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial,sans-serif;
}

.container{
  position:relative;
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.title{
  position:absolute;
  top:7%;
  color:white;
  font-size:1.4rem;
  font-weight:500;
  z-index:5;
}


/* PASSWORD */

.password-box{
  position:absolute;
  top:14%;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  z-index:10;
}

.password-box input{
  width:220px;
  padding:9px 15px;
  border-radius:20px;
  border:1px solid #ff69b4;
  background:#080808;
  color:white;
  text-align:center;
  outline:none;
  box-shadow:
  0 0 8px rgba(255,105,180,.4);
}

.password-box input::placeholder{
  color:#777;
}

.password-box button{
  padding:7px 22px;
  border-radius:20px;
  border:none;
  cursor:pointer;
  background:#ff69b4;
  color:white;
  box-shadow:
  0 0 10px #ff69b4;
}

.password-box button:hover{
  box-shadow:
  0 0 20px #ff69b4;
}

.hint{
  color:#777;
  font-size:.75rem;
}


/* HEART */

.scene{
  position:relative;
  width:320px;
  height:320px;
  display:flex;
  justify-content:center;
  align-items:center;
  transform-style:preserve-3d;
  animation:spin 9s linear infinite;
}

.word{
  position:absolute;
  color:#ff69b4;
  font-size:11px;
  font-weight:bold;
  white-space:nowrap;

  text-shadow:
  0 0 5px #ff69b4,
  0 0 10px #ff1493;
}

.cat{
  position:absolute;
  width:130px;
  border-radius:16px;
  z-index:2;
  box-shadow:0 0 25px rgba(255,105,180,0.25);
}


.tap{
  position:absolute;
  bottom:40px;
  color:#999;
  font-size:0.9rem;
  opacity:0.8;
}


/* LETTER PAGE */

#letterPage{
  display:none;
  position:fixed;
  inset:0;
  background:
  radial-gradient(circle at center,
  rgba(255,105,180,.15),
  black 60%);
  z-index:100;
  justify-content:center;
  align-items:center;
  padding:40px;
}


.letter-container{
  width:min(800px,90%);
  height:80%;
  background:
  rgba(20,0,10,.75);
  border:1px solid rgba(255,105,180,.5);
  border-radius:20px;
  padding:30px;
  box-shadow:
  0 0 30px rgba(255,105,180,.25),
  inset 0 0 20px rgba(255,105,180,.1);
}


#letterText{

  width:100%;
  height:100%;

  resize:none;

  background:transparent;
  border:none;
  outline:none;

  color:#ffd6eb;

  font-family:
  "Segoe Script",
  "Brush Script MT",
  cursive;

  font-size:22px;
  line-height:1.8;

}


#letterText::placeholder{
  color:#c47a9f;
}



@keyframes spin{
  from{
    transform:rotateY(0deg) rotateX(8deg);
  }

  to{
    transform:rotateY(360deg) rotateX(8deg);
  }
}


@media(max-width:600px){

  .scene{
    transform:scale(0.9);
  }

  .cat{
    width:110px;
  }

}

</style>

</head>


<body>


<div class="container">


<div class="title">
hai aleksa.
</div>



<div class="password-box">

<input 
type="password" 
id="passwordInput"
placeholder="enter password">

<button onclick="checkPassword()">
unlock ♡
</button>

<div class="hint">
password hint: meet me in *******
</div>

</div>





<audio id="music" autoplay loop playsinline>

<source src="imyourman.mp3" type="audio/mpeg">

</audio>




<div class="scene" id="heart">

<img src="bunnicat.jpg" class="cat">

</div>



<div class="tap">
tap anywhere if music doesn't play ♡
</div>


</div>




<div id="letterPage">


<div class="letter-container">


<textarea id="letterText">

</div>


</div>







<script>


const audio = document.getElementById("music");


audio.play().catch(() => {

document.body.addEventListener("click", () => {

audio.play();

document.querySelector(".tap").style.display="none";

}, {once:true});


});





const heart=document.getElementById("heart");


const text="I LOVE YOU";


const points=[];


for(let t=0;t<Math.PI*2;t+=0.22){


const x=16*Math.pow(Math.sin(t),3);


const y=
13*Math.cos(t)
-5*Math.cos(2*t)
-2*Math.cos(3*t)
-Math.cos(4*t);



points.push({

x:x*8,
y:-y*8

});


}





for(let layer=-2;layer<=2;layer++){


points.forEach((p)=>{


const span=document.createElement("span");


span.className="word";


span.innerText=text;


const z=layer*18;



span.style.left=`${160+p.x}px`;

span.style.top=`${160+p.y}px`;

span.style.transform=
`translate(-50%, -50%) translateZ(${z}px)`;


heart.appendChild(span);



});


}





function checkPassword(){


const entered =
document
.getElementById("passwordInput")
.value
.trim()
.toLowerCase();



if(entered==="montauk"){


document.querySelector(".container").style.display="none";

document.getElementById("letterPage").style.display="flex";


}

else{


alert("wrong password ♡");


}


}



</script>


</body>
</html>
